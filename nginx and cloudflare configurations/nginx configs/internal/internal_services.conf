# ────────────────────────────────────────────────────────────────────
#  myfatnasservices.com — Internal only
#  /         → landing (8000)
#  /emby/    → Emby (8096)
#  /homer/   → Homer (8080)
#  /monitor/ → Zabbix (10052)
# ────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 443 ssl;
    http2 on;
    server_name myfatnasservices.com;

    ssl_certificate     /etc/sslfree/myfatnasservices/fullchain.crt;
    ssl_certificate_key /etc/sslfree/myfatnasservices/private.key;

    client_max_body_size 10m;
    proxy_redirect       off;

    # ── Block hidden files ─────────────────────────────────────────
    location ~ /\. {
        deny          all;
        access_log    off;
        log_not_found off;
    }

    # ── Landing ────────────────────────────────────────────────────
    location / {
        allow 192.168.9.12;
        allow 192.168.9.20;
        allow 192.168.2.0/24;
        allow 172.22.0.0/16;
        deny  all;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Emby ───────────────────────────────────────────────────────
    location /emby/ {
        allow 192.168.9.12;
        allow 192.168.9.20;
        allow 192.168.9.11;
        allow 192.168.2.0/24;
        allow 172.22.0.0/16;
        deny  all;

        proxy_pass         http://127.0.0.1:8096/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
    }

    # ── Homer ──────────────────────────────────────────────────────
    location /homer/ {
        allow 192.168.9.12;
        allow 192.168.9.20;
        allow 192.168.2.0/24;
        allow 172.22.0.0/16;
        deny  all;

        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Zabbix_WEB─────────────────────────────────────────────────────
    location /monitor/ {
        allow 192.168.9.12;
        allow 192.168.9.20;
        allow 192.168.2.0/24;
        allow 172.22.0.0/16;
        deny  all;

        proxy_pass            http://127.0.0.1:10052/;
        proxy_http_version    1.1;
        proxy_set_header      Host                $host;
        proxy_set_header      X-Real-IP           $remote_addr;
        proxy_set_header      X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto   $scheme;
        proxy_set_header      X-Forwarded-Prefix  /monitor;
        proxy_set_header      Connection          "";

        proxy_redirect        /        /monitor/;
        proxy_cookie_path     /        /monitor/;

        sub_filter_types      application/javascript text/css;
        sub_filter_once       off;
        sub_filter 'href="/'            'href="/monitor/';
        sub_filter 'src="/'             'src="/monitor/';
        sub_filter 'action="/'          'action="/monitor/';
        sub_filter 'location.href = "/' 'location.href = "/monitor/';

        proxy_buffering       off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;
    }
}
