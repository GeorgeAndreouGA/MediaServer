# ────────────────────────────────────────────────────────────────────
#  internal.myfatnasservices.com — Internal server
#  Chain (public):  [DMZ :443] → [this server :443] → App
#  Chain (admin):   [LAN client] → [this server :443] → App
#
#  $remote_addr on public traffic = DMZ IP
#  $remote_addr on admin traffic  = real LAN client IP
#  $real_ip map resolves both correctly for the app
# ────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# ── Real IP: X-Real-IP from DMZ if present, else direct $remote_addr
map $http_x_real_ip $real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

upstream app {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream minigames {
    server 127.0.0.1:3007;
    keepalive 16;
}


server {
    listen 443 ssl;
    http2 on;
    server_name internal.myfatnasservices.com;

    ssl_certificate     /etc/sslfree/internal/fullchain.crt;
    ssl_certificate_key /etc/sslfree/internal/private.key;

    client_max_body_size 1m;
    proxy_redirect       off;




######## music site  #############

    # ── / → /music ────────────────────────────────────────────────
    location = / {
        return 301 /music;
    }

    # ── Admin UI — LAN only ────────────────────────────────────────
    location /music/admin {
        allow 192.168.9.20;
        allow 192.168.9.12;
        allow 192.168.2.0/24;
        deny  all;

        proxy_pass              http://app;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $real_ip;
        proxy_set_header        X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header        X-Forwarded-Host  $http_x_forwarded_host;
        proxy_set_header        X-Internal-Listener "";
        proxy_set_header        Connection        "";
    }

    # ── Admin API — LAN only ───────────────────────────────────────
    location /music/api/admin {
        allow 192.168.9.20;
        allow 192.168.9.12;
        allow 192.168.2.0/24;
        deny  all;

        proxy_pass              http://app;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $real_ip;
        proxy_set_header        X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header        X-Forwarded-Host  $http_x_forwarded_host;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        $connection_upgrade;
        proxy_set_header        X-Internal-Listener "";
    }

    # ── Audio streaming — public ───────────────────────────────────
    location /music/audio/ {
        proxy_pass              http://app;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $real_ip;
        proxy_set_header        X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header        X-Forwarded-Host  $http_x_forwarded_host;
        proxy_set_header        X-Internal-Listener "";
        proxy_set_header        Connection        "";
    }




    location /music {
        proxy_pass              http://app;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $real_ip;
        proxy_set_header        X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header        X-Forwarded-Host  $http_x_forwarded_host;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        $connection_upgrade;
        proxy_set_header        X-Internal-Listener "";
    }

######## music site  #############


 ######## mini games #############

    # ── Mini-games ─────────────────────────────────────────────────
    location /mini-games {
        proxy_pass         http://minigames;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $real_ip;
        proxy_set_header   X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $http_x_forwarded_host;
        proxy_set_header   X-Internal-Listener "";
        proxy_set_header   Connection        "";
    }

