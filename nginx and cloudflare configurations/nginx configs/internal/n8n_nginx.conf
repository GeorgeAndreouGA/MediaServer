# ────────────────────────────────────────────────────────────────────
#  n8n.myfatnasservices.com — Internal only
# ────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 443 ssl;
    http2 on;
    server_name n8n.myfatnasservices.com;

    ssl_certificate     /etc/sslfree/n8n.myfatnasservices/fullchain.crt;
    ssl_certificate_key /etc/sslfree/n8n.myfatnasservices/private.key;

    client_max_body_size 50m;
    proxy_redirect       off;
    proxy_connect_timeout 120s;
    proxy_read_timeout    86400s;
    proxy_send_timeout    86400s;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        allow 192.168.9.12;
        allow 192.168.9.20;
        allow 192.168.2.0/24;
        allow 172.22.0.0/16;
        deny  all;

        proxy_pass         http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
    }
}