# ────────────────────────────────────────────────────────────────────
#  echoriftsounds.com — DMZ (proxy.myfatnasservices.com)
#  Chain: Cloudflare → [this server :443] → [internal.myfatnasservices.com :443] → App
#  Admin routes fully blocked here — LAN only via internal
# ────────────────────────────────────────────────────────────────────

geo $realip_remote_addr $is_allowed {
    default          0;

    # ── Cloudflare IPv4 ───────────────────────────────────────────
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;

}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream caddy_public {
    server internal.myfatnasservices.com:443;
    keepalive 32;
}


server {
    listen 443 ssl;
    http2 on;
    server_name echoriftsounds.com;

    ssl_certificate     /etc/sslfree/echoriftsounds/fullchain.crt;
    ssl_certificate_key /etc/sslfree/echoriftsounds/private.key;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header   CF-Connecting-IP;

    if ($is_allowed = 0) { return 403; }

    client_max_body_size 1m;
    proxy_redirect       off;

    proxy_ssl_verify      off;
    proxy_ssl_server_name on;
    proxy_ssl_name        internal.myfatnasservices.com;



  ######## music site  #############

    # ── / → /music ────────────────────────────────────────────────
    location = / {
        return 301 /music;
    }

    # ── Admin — fully blocked ──────────────────────────────────────
    location /music/admin {
        return 403;
    }

    location /music/api/admin {
        return 403;
    }

    # ── Audio streaming — public ───────────────────────────────────
    location /music/audio/ {
        proxy_pass              https://caddy_public;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Host  $host;
        proxy_set_header        X-Internal-Listener "";
        proxy_set_header        Connection        "";
    }



 location /music {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "same-origin" always;
        add_header X-Frame-Options           "DENY" always;

        proxy_pass              https://caddy_public;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Host  $host;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        $connection_upgrade;
        proxy_set_header        X-Internal-Listener "";
    }



     ######## music site  #############


     ######## mini games #############


    # ── Mini-games ─────────────────────────────────────────────────
    location /mini-games {
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

        proxy_pass         https://caddy_public;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Internal-Listener "";
        proxy_set_header   Connection        "";
    }

  ######## mini games #############

  ######## add more services here ###########


   ######## add more services here ###########
   
}