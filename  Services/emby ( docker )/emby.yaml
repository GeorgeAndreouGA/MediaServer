services:
  emby:
    image: emby/embyserver_arm64v8:latest   # pick the right architecture: https://hub.docker.com/r/emby/
    container_name: embyserver
    hostname: your_hostname
    environment:
      - UID=1000
      - GID=100
      - GIDLIST=100
    volumes:
      - /root/Docker/emby/config:/config     # created automatically next to this file; mounted to /config in the container
      - /path/to/your_media:/mnt/media        # CHANGE to your media directory (an entire /media mount is fine too)
    ports:
      - "127.0.0.1:8096:8096"   # loopback only — never change the container-side port (right side)
    devices:
      - /dev/dri:/dev/dri       # hardware transcoding
      - /dev/vchiq:/dev/vchiq   # Raspberry Pi only (arm64v8)
    restart: unless-stopped

# DLNA support: enable it in Emby's own settings — see Emby's documentation for any additional host networking it requires.
